blueprint:
  name: WattsUp Energy — envoi des données
  description: >-
    Pousse les compteurs d'énergie et la couleur Tempo vers WattsUp Energy
    (contrat d'ingestion v1). La météo n'est pas envoyée : WattsUp la récupère
    lui-même pour la commune du foyer. Aucun port entrant à ouvrir : Home
    Assistant envoie, WattsUp ne l'interroge jamais.


    Prérequis : un `rest_command` nommé `wattsup_push` (voir le README du dépôt
    WattsUp, dossier homeassistant/).


    Mode **horaire** : chaque heure, les index cumulés (capteurs `total_increasing`).
    Mode **quotidien** : à 00:05, les totaux de la veille lus dans l'attribut
    `last_period` de vos `utility_meter` quotidiens.
  domain: automation
  source_url: https://github.com/kraftpunkapp/wattsup-energy/blob/main/homeassistant/blueprints/wattsup_push.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    granularity:
      name: Granularité
      description: Doit correspondre au réglage choisi dans WattsUp (Réglages › API d'ingestion).
      default: hourly
      selector:
        select:
          options:
            - label: Horaire (index cumulés, recommandé)
              value: hourly
            - label: Quotidien (totaux de la veille)
              value: daily

    energy:
      name: Compteurs d'énergie
      description: >-
        Mode horaire : capteurs cumulés (total_increasing). Les unités Wh, kWh et MWh
        sont converties automatiquement en kWh.
        Mode quotidien : utility_meter quotidiens (la valeur de la veille est lue
        dans `last_period`).
      input:
        grid_import:
          name: Import réseau (obligatoire)
          description: En mode quotidien avec un contrat HP/HC ou Tempo, laissez vide et renseignez les deux champs HP et HC ci-dessous.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        grid_import_hp:
          name: Import réseau heures pleines (mode quotidien HP/HC)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        grid_import_hc:
          name: Import réseau heures creuses (mode quotidien HP/HC)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        grid_export:
          name: Export réseau (surplus injecté)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        solar_production:
          name: Production solaire
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        battery_charge:
          name: Charge batterie
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        battery_charge_grid:
          name: Charge batterie depuis le réseau (si activé dans WattsUp)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        battery_discharge:
          name: Décharge batterie
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy

    categories_input:
      name: Postes de consommation
      input:
        categories:
          name: Postes (slug → entité)
          description: >-
            Correspondance entre le slug affiché dans WattsUp (Réglages › Postes de
            consommation) et un capteur d'énergie. Exemple :
            `eau-chaude: sensor.chauffe_eau_energy`
          default: {}
          selector:
            object: {}

    tempo:
      name: Tempo
      input:
        tempo_color:
          name: Couleur Tempo du jour (optionnel)
          description: Capteur dont l'état vaut bleu, blanc ou rouge (casse indifférente). Laissez vide si vous n'êtes pas au tarif Tempo ou si vous n'avez pas ce capteur.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

mode: queued
max: 3

triggers:
  - trigger: time_pattern
    minutes: 0
    id: hourly
  - trigger: time
    at: "00:05:00"
    id: daily
  # Historique à la demande : lancé par le script « WattsUp Energy — envoyer l'historique »
  # (blueprint wattsup_history.yaml), avec deux dates.
  - trigger: event
    event_type: wattsup_backfill
    id: backfill

variables:
  granularity: !input granularity
  grid_import: !input grid_import
  grid_import_hp: !input grid_import_hp
  grid_import_hc: !input grid_import_hc
  energy_entities:
    grid_export_kwh: !input grid_export
    solar_production_kwh: !input solar_production
    battery_charge_kwh: !input battery_charge
    battery_charge_grid_kwh: !input battery_charge_grid
    battery_discharge_kwh: !input battery_discharge
  categories: !input categories
  tempo_color: !input tempo_color

  # Capteurs choisis mais sans valeur numérique (indisponibles, inconnus) : omis de l'envoi,
  # WattsUp ne peut pas les nommer ; la notification les cite.
  unreadable: >-
    {%- set daily = granularity == 'daily' -%}
    {%- set chosen = [grid_import, grid_import_hp, grid_import_hc]
        + (energy_entities.values() | list) + ((categories or {}).values() | list) -%}
    {%- set ns = namespace(found=[]) -%}
    {%- for e in chosen if e -%}
      {%- set v = state_attr(e, 'last_period') if daily else states(e) -%}
      {%- if v is none or not (v | is_number) -%}
        {%- set ns.found = ns.found + [e ~ ' (' ~ states(e) ~ ')'] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}

  # Historique : compteur WattsUp → capteur, d'après les mêmes entrées que l'envoi horaire.
  backfill_metrics: >-
    {%- set ns = namespace(m={}) -%}
    {%- if grid_import -%}{%- set ns.m = dict(ns.m, grid_import=grid_import) -%}{%- endif -%}
    {%- for key, e in energy_entities.items() -%}
      {%- if e -%}{%- set ns.m = dict(ns.m, **{key[:-4]: e}) -%}{%- endif -%}
    {%- endfor -%}
    {%- for slug, e in (categories or {}).items() -%}
      {%- if e -%}{%- set ns.m = dict(ns.m, **{'category:' ~ slug: e}) -%}{%- endif -%}
    {%- endfor -%}
    {{ ns.m }}

  # Construit le payload v1. Les capteurs indisponibles ou non numériques sont
  # omis (jamais remplacés par 0, qui fausserait les deltas).
  payload: >-
    {%- set daily = granularity == 'daily' -%}
    {%- macro read(e) -%}
      {%- if e -%}
        {%- set v = state_attr(e, 'last_period') if daily else states(e) -%}
        {%- set factor = {'Wh': 0.001, 'kWh': 1, 'MWh': 1000}.get(state_attr(e, 'unit_of_measurement'), 1) -%}
        {{- (v | float * factor) if v is not none and v | is_number else '' -}}
      {%- endif -%}
    {%- endmacro -%}
    {%- set ns = namespace(p={'version': 1}, energy={}, cats={}) -%}
    {%- for key, e in energy_entities.items() -%}
      {%- set v = read(e) -%}
      {%- if v != '' -%}{%- set ns.energy = dict(ns.energy, **{key: v | float}) -%}{%- endif -%}
    {%- endfor -%}
    {%- for slug, e in (categories or {}).items() -%}
      {%- set v = read(e) -%}
      {%- if v != '' -%}{%- set ns.cats = dict(ns.cats, **{slug: v | float}) -%}{%- endif -%}
    {%- endfor -%}
    {%- if daily -%}
      {%- set ns.p = dict(ns.p, date=(now() - timedelta(days=1)).date().isoformat()) -%}
      {%- set hp = read(grid_import_hp) -%}
      {%- set hc = read(grid_import_hc) -%}
      {%- set total = read(grid_import) -%}
      {%- if hp != '' and hc != '' -%}
        {%- set ns.p = dict(ns.p, grid_import={'hp_kwh': hp | float, 'hc_kwh': hc | float}) -%}
      {%- elif total != '' -%}
        {%- set ns.p = dict(ns.p, grid_import={'kwh': total | float}) -%}
      {%- endif -%}
      {%- set ns.p = dict(ns.p, **ns.energy) -%}
    {%- else -%}
      {%- set ns.p = dict(ns.p, ts=now().isoformat()) -%}
      {%- set total = read(grid_import) -%}
      {%- if total != '' -%}{%- set ns.energy = dict(ns.energy, grid_import_kwh=total | float) -%}{%- endif -%}
      {%- if ns.energy -%}{%- set ns.p = dict(ns.p, energy=ns.energy) -%}{%- endif -%}
    {%- endif -%}
    {%- if ns.cats -%}{%- set ns.p = dict(ns.p, categories=ns.cats) -%}{%- endif -%}
    {%- set color = (states(tempo_color) | lower) if tempo_color else '' -%}
    {%- if color in ['bleu', 'blanc', 'rouge'] -%}{%- set ns.p = dict(ns.p, tempo_color=color) -%}{%- endif -%}
    {{- ns.p | to_json -}}

conditions:
  # Seul le déclencheur du mode choisi envoie (horaire ou 00:05), plus l'historique demandé.
  - condition: or
    conditions:
      - condition: trigger
        id: !input granularity
      - condition: trigger
        id: backfill

actions:
  - if:
      - condition: trigger
        id: backfill
    then:
      # Historique, jour par jour : statistiques horaires du recorder (variation, en kWh),
      # envoyées avec la correspondance des compteurs. WattsUp ne remplace jamais une
      # valeur déjà présente et rejette les valeurs invraisemblables.
      - variables:
          bf_start: "{{ trigger.event.data.start }}"
          bf_end: "{{ trigger.event.data.end }}"
          bf_days: >-
            {{ [((as_datetime(bf_end) - as_datetime(bf_start)).days + 1), 0] | max }}
          bf_ids: "{{ backfill_metrics.values() | list | unique | list }}"
      - repeat:
          # 10 ans au plus (la limite de WattsUp).
          count: "{{ [bf_days | int, 3660] | min }}"
          sequence:
            - variables:
                bf_day: "{{ (as_datetime(bf_start) + timedelta(days=repeat.index - 1)).strftime('%Y-%m-%d') }}"
            - action: recorder.get_statistics
              data:
                statistic_ids: "{{ bf_ids }}"
                start_time: "{{ bf_day }} 00:00:00"
                end_time: >-
                  {{ (as_datetime(bf_day) + timedelta(days=1)).strftime('%Y-%m-%d') }} 00:00:00
                period: hour
                types:
                  - change
                units:
                  energy: kWh
              response_variable: bf_stats
            - action: rest_command.wattsup_push
              data:
                payload: >-
                  {{ {'version': 1, 'backfill': {'metrics': backfill_metrics,
                      'statistics': bf_stats.statistics}} | to_json }}
              response_variable: wattsup_response
              continue_on_error: true
            - if:
                - condition: template
                  value_template: >-
                    {{ wattsup_response is not defined or wattsup_response.status != 200 }}
              then:
                - action: persistent_notification.create
                  data:
                    notification_id: wattsup_backfill
                    title: WattsUp Energy — historique interrompu
                    message: >-
                      {%- set r = wattsup_response if wattsup_response is defined else none -%}
                      Envoi du {{ bf_day }} refusé :
                      {% if r is none -%}
                        WattsUp ne répond pas (adresse du rest_command « wattsup_push » ou
                        connexion internet de Home Assistant).
                      {%- elif r.content is mapping and r.content.message is defined -%}
                        {{ r.content.message }}
                      {%- else -%}
                        statut {{ r.status }}, {{ r.content }}
                      {%- endif -%}
                - stop: Historique interrompu
            # 120 envois par minute au plus côté WattsUp : on reste très en dessous.
            - delay:
                seconds: 1
      - action: persistent_notification.create
        data:
          notification_id: wattsup_backfill
          title: WattsUp Energy — historique envoyé
          message: >-
            Du {{ bf_start }} au {{ bf_end }}. Détail dans WattsUp › Réglages › Home Assistant ›
            Derniers envois.
    else:
      - action: rest_command.wattsup_push
        data:
          payload: "{{ payload }}"
        response_variable: wattsup_response
        continue_on_error: true
      # Ce qu'il faut corriger, en clair : la phrase renvoyée par WattsUp (`message`, capteur
      # « Import réseau » oublié, token refusé…), plus les capteurs choisis restés sans valeur.
      - variables:
          wattsup_refused: >-
            {{ wattsup_response is not defined or wattsup_response.status != 200 }}
          wattsup_message: >-
            {%- set r = wattsup_response if wattsup_response is defined else none -%}
            {%- set ns = namespace(parts=[]) -%}
            {%- if r is none -%}
              {%- set ns.parts = ns.parts + ["WattsUp ne répond pas : vérifiez l'adresse du rest_command « wattsup_push » et la connexion internet de Home Assistant."] -%}
            {%- elif r.content is mapping and r.content.message is defined -%}
              {%- set ns.parts = ns.parts + [r.content.message] -%}
            {%- elif r.status != 200 -%}
              {%- set ns.parts = ns.parts + ["Envoi refusé (statut " ~ r.status ~ ") : " ~ (r.content | string)] -%}
            {%- endif -%}
            {%- if unreadable | length > 0 -%}
              {%- set ns.parts = ns.parts + ["Capteurs choisis mais sans valeur dans Home Assistant : " ~ (unreadable | join(', ')) ~ "."] -%}
            {%- endif -%}
            {{ ns.parts | join(' ') }}
      - if:
          - condition: template
            value_template: "{{ wattsup_message | trim != '' }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: wattsup_push_error
              title: >-
                {{ 'WattsUp Energy — envoi refusé' if wattsup_refused
                   else 'WattsUp Energy — envoi à vérifier' }}
              message: "{{ wattsup_message }}"
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: wattsup_push_error
